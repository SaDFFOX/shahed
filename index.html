<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Zelenskiy | Официальный сайт</title>
    <style>
        /* Базовый сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- ГЛАВНЫЙ ЭКРАН С АНИМАЦИЕЙ --- */
        #hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ТУТ ТВОЙ ФОН (shahed.png с GitHub) */
            background: url('https://raw.githubusercontent.com/SaDFFOX/shahed/main/shahed.png') center/cover no-repeat;
            border-bottom: 5px solid #222;
        }

        /* Затемнение фона, чтобы анимация была виднее */
        #hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2); 
            z-index: 1;
        }

        /* ЗЕЛЕНСКИЙ (gayphoto.png) */
        .zelensky {
            position: absolute;
            width: 150px;
            max-width: 30vw;
            height: auto;
            z-index: 10;
            bottom: 40%;
            left: -200px;
            animation: flyZelensky 6s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(0,255,0,0.5));
            object-fit: contain;
        }

        @keyframes flyZelensky {
            0% { left: -200px; bottom: 40%; transform: rotate(10deg) scale(1); }
            40% { left: 45%; bottom: 60%; transform: rotate(-5deg) scale(1.1); }
            80% { left: 110%; bottom: 30%; transform: rotate(15deg) scale(1); }
            100% { left: 110%; bottom: 30%; transform: rotate(15deg) scale(1); }
        }

        /* ШАХЕД (dashahed.png) */
        .shahed-drone {
            position: absolute;
            width: 120px;
            max-width: 25vw;
            height: auto;
            z-index: 9;
            bottom: 50%;
            left: -300px;
            animation: flyShahed 6s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255,0,0,0.8));
            object-fit: contain;
        }

        @keyframes flyShahed {
            0% { left: -300px; bottom: 50%; transform: rotate(-10deg); }
            40% { left: 30%; bottom: 70%; transform: rotate(5deg); }
            50% { left: 47%; bottom: 58%; transform: scale(1.2) rotate(-45deg); opacity: 1; }
            55% { left: 50%; bottom: 50%; transform: scale(1.5) rotate(90deg); opacity: 0; }
            100% { left: 50%; bottom: 50%; transform: scale(1.5); opacity: 0; }
        }

        /* Взрыв */
        .explosion {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #fff, #ff9800, #f44336, transparent);
            border-radius: 50%;
            z-index: 15;
            left: 50%;
            bottom: 50%;
            opacity: 0;
            transform: translate(-50%, 50%);
            animation: explode 6s ease-in-out infinite;
        }

        @keyframes explode {
            0%, 49% { width: 10px; height: 10px; opacity: 0; }
            50% { width: 50px; height: 50px; opacity: 1; box-shadow: 0 0 100px 50px #ff5722, 0 0 200px 100px #ff9800; }
            60% { width: 200px; height: 200px; opacity: 0; box-shadow: 0 0 150px 100px #ff5722, 0 0 300px 200px #ff9800; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        /* Заголовок */
        .hero-bottom-text {
            position: absolute;
            bottom: 5%;
            z-index: 20;
            font-size: 40px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 20px #0057B7, 0 0 40px #000;
            pointer-events: none;
            animation: pulseTitle 2s infinite alternate;
        }

        @keyframes pulseTitle {
            from { transform: scale(1); text-shadow: 0 0 20px #0057B7, 0 0 40px #000; }
            to { transform: scale(1.05); text-shadow: 0 0 30px #FFD700, 0 0 60px #000; }
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ --- */
        #download-section {
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            background: #111;
            position: relative;
            z-index: 30;
        }

        .section-title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px #0057B7;
        }

        .download-desc {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
        }

        .btn-download {
            padding: 20px 60px;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(45deg, #F44336, #D32F2F);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(244, 67, 54, 0.6);
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            animation: pulseBtn 1.5s infinite alternate;
        }

        @keyframes pulseBtn {
            from { transform: scale(1); box-shadow: 0 0 20px rgba(244, 67, 54, 0.6); }
            to { transform: scale(1.05); box-shadow: 0 0 50px rgba(244, 67, 54, 1); }
        }

        .btn-download:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #ff5722, #F44336);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #000;
            color: #555;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero-bottom-text { font-size: 24px; }
            .zelensky { width: 100px; }
            .shahed-drone { width: 80px; }
            .section-title { font-size: 32px; }
            .btn-download { font-size: 20px; padding: 15px 40px; }
        }
    </style>
</head>
<body>

    <section id="hero">
        <!-- Зеленский и Шахед с твоего GitHub -->
        <img src="https://raw.githubusercontent.com/SaDFFOX/shahed/main/gayphoto.png" alt="Зеленский" class="zelensky">
        <img src="https://raw.githubusercontent.com/SaDFFOX/shahed/main/dashahed.png" alt="Шахед" class="shahed-drone">
        
        <div class="explosion"></div>
        
        <h1 class="hero-bottom-text">Flappy Zelenskiy</h1>
    </section>

    <section id="download-section">
        <h2 class="section-title">Готов к взлёту?</h2>
        <p class="download-desc">Скачай игру, проверь свою реакцию и не дай шахеду догнать тебя. Обычный режим для новичков и HARD MODE для настоящих киберспортсменов.</p>
        
        <!-- ВСТАВЬ СЮДА ССЫЛКУ НА СВОЙ РЕЛИЗ -->
        <a href="#" class="btn-download" target="_blank">
            Скачать игру
        </a>
    </section>

    <footer>
        Flappy Zelenskiy &copy; 2026.
    </footer>

</body>
</html>
